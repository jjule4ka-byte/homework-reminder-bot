name: send-reminder
on:
  schedule:
    - cron: '30 11 * * 1-5'   # 14:30 МСК, пн-пт
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collect new subscribers
        env:
          MAX_BOT_TOKEN: ${{ secrets.MAX_BOT_TOKEN }}
          MODE: send
          REMINDER_TEXT: ${{ vars.REMINDER_TEXT }}
        run: python bot.py
      - name: Save data
        run: |
          git config user.name "bot"
          git config user.email "bot@users.noreply.github.com"
          git add users.json consents.json
          git diff --cached --quiet || (git commit -m "update subscribers" && git push)
